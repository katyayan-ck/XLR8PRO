name: Shared cPanel Auto-Publish Pipeline

on:
  push:
    branches:
      - stage
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Environment Variables
        id: env-setup
        run: |
          if [ "${{ github.ref_name }}" = "stage" ]; then
            echo "dir=/home/${{ secrets.SSH_USER }}/dev.xceler8.in" >> $GITHUB_OUTPUT
            echo "env_name=Development Staging (dev.xceler8.in)" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "uat" ]; then
            echo "dir=/home/${{ secrets.SSH_USER }}/uat.xceler8.in" >> $GITHUB_OUTPUT
            echo "env_name=UAT/Staging (uat.xceler8.in)" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/home/${{ secrets.SSH_USER }}/crm.xceler8.in" >> $GITHUB_OUTPUT
            echo "env_name=Production CRM (crm.xceler8.in)" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote SSH Deployment Hooks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true # Fails the pipeline instantly if any console step errors out
          script: |
            echo "Starting deployment loop for target: ${{ steps.env-setup.outputs.env_name }}"
            
            # Navigate to the core project directory (where Git and Composer live)
            cd ${{ steps.env-setup.outputs.dir }}
            
            # Step A: Place site into maintenance mode safely via the public target hook
            php artisan down || true
            
            # Step B: Synchronize working tree hard against incoming branch commits
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # Step C: Complete Core Base Composer Installation Engine
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Step D: Make the developer hook script executable and trigger it dynamically
            chmod +x deploy-hook.sh
            ./deploy-hook.sh
            
            # Step E: Bring the server application environment back online smoothly
            php artisan up
            echo "Deployment successfully executed!"
